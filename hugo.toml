baseURL = "http://literatur.psng.info/"
languageCode = "de"
title = "PSNG Literatur Blog"
[pagination]
  pagerSize = 12
  summaryLength = 40
  enableRobotsTXT = true
  enableEmoji = false

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  description = "Ein kuratierter Raum für Paper, Bücher und sonstige Literatur zum Thema Psychedelika."
  author = "David"
  mainSections = ["posts"]
  readingSpeed = 200

[params.social]
  github = ""
  twitter = ""

# Backend für Bewertungen, Kommentare, Änderungsvorschläge und Einreichungen
# (literatur-backend). apiBase gilt für die veröffentlichte Seite, devApiBase
# für `hugo server`. Beide leer = die Funktionen laden nicht, die Seite bleibt
# wie vorher.
[params.comments]
  apiBase = "https://comments.grey.quest"
  devApiBase = "http://127.0.0.1:8080"

# Einreichungsformular unter /einreichen/. Es reicht über das Backend oben
# ein. mailTo ist nur der Notausgang, falls das Backend nicht erreichbar ist.
[params.submit]
  mailTo = "psngblog@gmail.com"
  maxImageMB = 8

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.RSS]
    mediatype = "application/rss+xml"
    baseName = "feed"

[menus]
  [[menus.main]]
    name = "Blog Startseite"
    url = "/"
    weight = 1

  [[menus.main]]
    name = "PSNG Hauptseite"
    url = "https://psng.info/"
    weight = 2

  [[menus.main]]
    name = "Alle Beiträge"
    url = "/posts/"
    weight = 3

  [[menus.main]]
    name = "Bücher"
    url = "/categories/buch/"
    weight = 4

  [[menus.main]]
    name = "Paper"
    url = "/categories/paper/"
    weight = 5

  [[menus.main]]
    name = "Podcasts"
    url = "/categories/podcast/"
    weight = 6

  [[menus.main]]
    name = "Beitrag einreichen"
    url = "/einreichen/"
    weight = 7

[minify]
  [minify.tdewolff]
    [minify.tdewolff.css]
      version = 2
    [minify.tdewolff.html]
      keepWhitespace = false
